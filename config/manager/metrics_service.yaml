apiVersion: v1
kind: Service
metadata:
  name: agentic-operator-metrics-service
  namespace: __OPERATOR_NAMESPACE__
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: agentic-operator-metrics-tls
spec:
  ports:
    - name: metrics
      port: 8443
      protocol: TCP
      targetPort: metrics
  selector:
    control-plane: controller-manager

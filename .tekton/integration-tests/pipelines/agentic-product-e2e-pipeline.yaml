---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: agentic-product-e2e-pipeline
spec:
  description: |
    Runs lightspeed-agentic-operator product e2e tests on a Konflux HyperShift ephemeral OpenShift cluster.
    Deploys the operator with the real sandbox image from SNAPSHOT, then runs
    scripts/e2e-cluster.sh in order against Vertex Claude, Vertex Gemini,
    OpenAI, Azure OpenAI, Bedrock DeepSeek, and Bedrock Claude, with live
    credentials from Konflux workspace secrets.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: 'agentic-product-e2e'
      type: string
    - name: namespace
      description: 'Namespace to deploy the operator into'
      default: 'openshift-lightspeed'
      type: string
    - name: openshift-version-prefix
      description: 'OpenShift minor version to provision (for example, 4.22).'
      default: '4.22'
      type: string
    - name: compute-node-type
      description: 'EC2 instance type for the ephemeral cluster compute nodes; m5.2xlarge = amd64, m6g.2xlarge = arm64.'
      type: string
      default: 'm5.2xlarge'
    - name: node-arch
      description: 'Compute node processor architecture; must match the compute-node-type instance family (m5* = amd64, m6g* = arm64).'
      type: string
      default: 'amd64'
  tasks:
    - name: validate-pipeline-params
      description: Reject params that cannot be safely embedded in the provisioning env JSON before provisioning starts.
      taskSpec:
        stepTemplate:
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          computeResources:
            limits:
              cpu: 100m
              memory: 128Mi
        steps:
          - name: validate-compute-node-type
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: COMPUTE_NODE_TYPE
                value: $(params.compute-node-type)
            script: |
              #!/bin/sh
              # compute-node-type is substituted into the provision-ephemeral-cluster env JSON;
              # reject anything that is not a plain EC2 instance type so the JSON stays valid.
              # Use a whole-value case check (not grep): grep anchors apply per line, so a
              # value like 'm5.2xlarge\n"bad"' would pass and break the JSON.
              case "$COMPUTE_NODE_TYPE" in
                '')
                  echo "invalid compute-node-type: value is empty" >&2
                  exit 1
                  ;;
                *[!a-zA-Z0-9.-]*)
                  echo "invalid compute-node-type: '$COMPUTE_NODE_TYPE'" >&2
                  echo "must be a plain EC2 instance type (e.g. m5.2xlarge, m6g.2xlarge); quotes, spaces, newlines and special characters break the provisioning env JSON" >&2
                  exit 1
                  ;;
              esac
          - name: validate-node-arch
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: NODE_ARCH
                value: $(params.node-arch)
              - name: COMPUTE_NODE_TYPE
                value: $(params.compute-node-type)
            script: |
              #!/bin/sh
              # node-arch is substituted into the provision-ephemeral-cluster env JSON;
              # only amd64/arm64 are supported by the hypershift-hostedcluster workflow.
              # Validate before provisioning so a bad value fails fast instead of
              # after a 2h cluster provisioning timeout.
              case "$NODE_ARCH" in
                amd64|arm64) ;;
                *)
                  echo "invalid node-arch: '$NODE_ARCH'" >&2
                  echo "must be amd64 or arm64 (HYPERSHIFT_NODE_ARCH of hypershift-hostedcluster-create-hostedcluster)" >&2
                  exit 1
                  ;;
              esac
              # Cross-check node-arch against the compute-node-type instance family.
              # An arch/instance mismatch (e.g. default amd64 with m6g.2xlarge Graviton
              # instances) creates a cluster whose nodes cannot boot the payload.
              FAMILY=$(printf '%s' "$COMPUTE_NODE_TYPE" | sed -E 's/\..*$//')
              case "$FAMILY" in
                # g5g instances are arm64 (Graviton2) GPU instances; check them
                # before the generic GPU branch below, which assumes x86_64.
                g5g*)
                  if [ "$NODE_ARCH" != "arm64" ]; then
                    echo "incompatible params: compute-node-type '$COMPUTE_NODE_TYPE' is an arm64 (Graviton2, g5g) GPU instance family but node-arch is '$NODE_ARCH'" >&2
                    echo "set node-arch: arm64 for this instance type" >&2
                    exit 1
                  fi
                  ;;
                # Graviton (arm64) families carry a 'g' after the leading letter
                # (m6g, c7gn, m6gd, t4g, r7gz, ...); GPU families (g*, p*) are x86_64.
                g*|p*)
                  if [ "$NODE_ARCH" != "amd64" ]; then
                    echo "incompatible params: compute-node-type '$COMPUTE_NODE_TYPE' looks like an x86_64 (GPU) instance family but node-arch is '$NODE_ARCH'" >&2
                    echo "set node-arch: amd64 for this instance type" >&2
                    exit 1
                  fi
                  ;;
                ?*g*)
                  if [ "$NODE_ARCH" != "arm64" ]; then
                    echo "incompatible params: compute-node-type '$COMPUTE_NODE_TYPE' is an arm64 (Graviton) instance family but node-arch is '$NODE_ARCH'" >&2
                    echo "set node-arch: arm64 for this instance type" >&2
                    exit 1
                  fi
                  ;;
                # Common x86_64 families
                m[0-9]*|c[0-9]*|r[0-9]*|t[0-9]*|x[0-9]*|z[0-9]*|i[0-9]*|d[0-9]*|h[0-9]*)
                  if [ "$NODE_ARCH" != "amd64" ]; then
                    echo "incompatible params: compute-node-type '$COMPUTE_NODE_TYPE' looks like an x86_64 instance family but node-arch is '$NODE_ARCH'" >&2
                    echo "set node-arch: amd64 for this instance type" >&2
                    exit 1
                  fi
                  ;;
                # Unknown family: do not block, preserve existing behavior.
                *)
                  echo "note: could not determine architecture of instance family '$FAMILY'; skipping arch cross-check" >&2
                  ;;
              esac
    - name: provision-ephemeral-cluster
      runAfter:
        - validate-pipeline-params
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: env
          value: '{"COMPUTE_NODE_TYPE": "$(params.compute-node-type)", "HYPERSHIFT_NODE_ARCH": "$(params.node-arch)", "HYPERSHIFT_NODE_COUNT": "3", "HOSTED_MANAGEMENT_CLUSTER": "hosted-mgmt2"}'
        - name: releases
          value: '{"latest":{"release":{"channel":"stable","version":"$(params.openshift-version-prefix)","architecture":"multi"}}}'
    - name: deploy-and-test
      description: Deploy operator with real sandbox, run product e2e against all LLM providers.
      runAfter:
        - provision-ephemeral-cluster
      taskSpec:
        params:
          - name: SNAPSHOT
            type: string
          - name: clusterCredentialsSecretRef
            type: string
          - name: namespace
            type: string
        results:
          - name: commit
            value: "$(steps.extract-images.results.commit)"
        volumes:
          - name: cluster-credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
          - name: vertex-creds
            secret:
              secretName: vertex-apitoken
          - name: openai-creds
            secret:
              secretName: openai
          - name: azure-openai-creds
            secret:
              secretName: azureopenai-apitoken
          - name: azureopenai-entra-id
            secret:
              secretName: azureopenai-entra-id
          - name: bedrock-creds
            secret:
              secretName: bedrock-apitoken
          - name: bedrock-role-creds
            secret:
              secretName: bedrock-role-apitoken
          - name: ols-konflux-artifacts-bot-creds
            secret:
              secretName: ols-konflux-artifacts-bot
        steps:
          - name: extract-images
            results:
              - name: commit
                type: string
              - name: operator-image
                type: string
              - name: sandbox-image
                type: string
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: KONFLUX_COMPONENT_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['appstudio.openshift.io/component']
            image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
            script: |
              set -euo pipefail
              dnf -y install jq

              OPERATOR_IMAGE="$(jq -r --arg cn "${KONFLUX_COMPONENT_NAME}" \
                '.components[] | select(.name == $cn) | .containerImage' <<< "$SNAPSHOT")"
              if [ -z "$OPERATOR_IMAGE" ] || [ "$OPERATOR_IMAGE" = "null" ]; then
                echo "ERROR: could not extract operator image from SNAPSHOT"
                exit 1
              fi

              COMMIT="$(jq -r --arg cn "${KONFLUX_COMPONENT_NAME}" \
                '.components[] | select(.name == $cn) | .source.git.revision' <<< "$SNAPSHOT")"
              if [ -z "$COMMIT" ] || [ "$COMMIT" = "null" ]; then
                echo "ERROR: could not extract git revision from SNAPSHOT"
                exit 1
              fi

              SANDBOX_IMAGE="$(jq -r \
                '.components[] | select(.name == "lightspeed-agentic-sandbox") | .containerImage' <<< "$SNAPSHOT")"
              if [ -z "$SANDBOX_IMAGE" ] || [ "$SANDBOX_IMAGE" = "null" ]; then
                SANDBOX_IMAGE="quay.io/openshift-lightspeed/lightspeed-agentic-sandbox:latest"
                echo "WARN: sandbox component not in SNAPSHOT, falling back to ${SANDBOX_IMAGE}"
              fi

              echo "OPERATOR_IMAGE=${OPERATOR_IMAGE}"
              echo "SANDBOX_IMAGE=${SANDBOX_IMAGE}"
              echo "COMMIT=${COMMIT}"

              echo -n "${COMMIT}" > $(step.results.commit.path)
              echo -n "${OPERATOR_IMAGE}" > $(step.results.operator-image.path)
              echo -n "${SANDBOX_IMAGE}" > $(step.results.sandbox-image.path)
          - name: install-operator
            volumeMounts:
              - name: cluster-credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: NAMESPACE
                value: "$(params.namespace)"
              - name: COMMIT
                value: "$(steps.extract-images.results.commit)"
              - name: IMG
                value: "$(steps.extract-images.results.operator-image)"
              - name: SANDBOX_IMAGE
                value: "$(steps.extract-images.results.sandbox-image)"
            image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
            script: |
              set -euo pipefail
              dnf -y install jq git make golang

              git clone --depth=1 https://github.com/openshift/lightspeed-agentic-operator.git /workspace/repo
              cd /workspace/repo
              git fetch --depth=1 origin "${COMMIT}"
              git checkout "${COMMIT}"

              IMG="${IMG}" \
              OPERATOR_NAMESPACE="${NAMESPACE}" \
              SANDBOX_IMAGE="${SANDBOX_IMAGE}" \
              bash .tekton/integration-tests/scripts/install-operator.sh
          - name: run-product-e2e
            resources:
              requests:
                memory: "8Gi"
              limits:
                memory: "8Gi"
            onError: continue
            volumeMounts:
              - name: cluster-credentials
                mountPath: /credentials
              - name: vertex-creds
                mountPath: /var/run/credentials/vertex
              - name: openai-creds
                mountPath: /var/run/credentials/openai
              - name: azure-openai-creds
                mountPath: /var/run/credentials/azure-openai
              - name: azureopenai-entra-id
                mountPath: /var/run/credentials/azureopenai-entra-id
              - name: bedrock-creds
                mountPath: /var/run/credentials/bedrock
              - name: bedrock-role-creds
                mountPath: /var/run/credentials/bedrock-role
            env:
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: OPERATOR_NAMESPACE
                value: "$(params.namespace)"
              - name: SANDBOX_IMAGE
                value: "$(steps.extract-images.results.sandbox-image)"
              - name: VERTEX_PROVIDER_KEY_PATH
                value: "/var/run/credentials/vertex/token"
              - name: VERTEX_PROJECT_ID
                value: "openshift-lightspeed-tests"
              - name: VERTEX_REGION
                value: "global"
              - name: OPENAI_PROVIDER_KEY_PATH
                value: "/var/run/credentials/openai/token"
              - name: AZUREOPENAI_PROVIDER_KEY_PATH
                value: "/var/run/credentials/azure-openai/token"
              - name: AZURE_OPENAI_ENDPOINT
                value: "https://ols-test.openai.azure.com/"
              - name: BEDROCK_REGION
                value: "us-east-1"
              - name: BEDROCK_URL
                value: "https://bedrock-mantle.us-east-1.api.aws"
              - name: BEDROCK_AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: bedrock-apitoken
                    key: aws_access_key_id
              - name: BEDROCK_AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: bedrock-apitoken
                    key: aws_secret_access_key
              - name: BEDROCK_ROLE_AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: bedrock-role-apitoken
                    key: aws_access_key_id
              - name: BEDROCK_ROLE_AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: bedrock-role-apitoken
                    key: aws_secret_access_key
              - name: BEDROCK_ROLE_ARN
                value: "arn:aws:iam::103138678430:role/BedrockAccessRole"
              - name: ARTIFACT_DIR
                value: "/workspace/konflux-artifacts"
              - name: E2E_SCENARIO_TAGS
                value: "alert"
            image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
            script: |
              set -euo pipefail
              dnf -y install git make golang jq
              cd /workspace/repo
              mkdir -p "${ARTIFACT_DIR}"
              make product-e2e 2>&1 | tee "${ARTIFACT_DIR}/product-e2e-output.log"
          - name: gather-cluster-resources
            onError: continue
            volumeMounts:
              - name: cluster-credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: ARTIFACT_DIR
                value: "/workspace/konflux-artifacts"
              - name: NAMESPACE
                value: "$(params.namespace)"
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            script: |
              #!/bin/bash
              set -x
              cd "${ARTIFACT_DIR}"
              oc get proposals -A -o yaml > proposals.yaml 2>/dev/null || true
              oc get proposalapprovals -A -o yaml > proposalapprovals.yaml 2>/dev/null || true
              oc get analysisresults -A -o yaml > analysisresults.yaml 2>/dev/null || true
              oc get executionresults -A -o yaml > executionresults.yaml 2>/dev/null || true
              oc get verificationresults -A -o yaml > verificationresults.yaml 2>/dev/null || true
              oc get pods -n "${NAMESPACE}" -o yaml > pods.yaml 2>/dev/null || true
              oc logs -n "${NAMESPACE}" deployment/controller-manager --tail=500 > operator-logs.txt 2>/dev/null || true
              echo "Artifacts gathered:"
              ls -la "${ARTIFACT_DIR}"
          - name: list-artifacts
            onError: continue
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            workingDir: /workspace/konflux-artifacts
            script: |
              #!/bin/bash
              echo "=== Artifacts to push ==="
              ls -la /workspace/konflux-artifacts
          - name: push-artifacts
            onError: continue
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
            params:
              - name: workdir-path
                value: /workspace/konflux-artifacts
              - name: oci-ref
                value: "quay.io/openshift-lightspeed/ols-operator-artifacts:agentic-product-e2e-$(steps.extract-images.results.commit)"
              - name: credentials-volume-name
                value: ols-konflux-artifacts-bot-creds
          - name: fail-if-any-step-failed
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: namespace
          value: "$(params.namespace)"
  finally:
    - name: export-logs-for-retention
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/export-logs/0.1/export-logs-to-quay.yaml
      params:
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)
        - name: namespace
          value: $(context.pipelineRun.namespace)
        - name: quay-repo
          value: "quay.io/openshift-lightspeed/ols-operator-artifacts"
        - name: artifact-credentials-secret
          value: ols-konflux-artifacts-bot

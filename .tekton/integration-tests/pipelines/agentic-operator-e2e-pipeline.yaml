---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: agentic-operator-e2e-pipeline
spec:
  description: |
    Runs lightspeed-agentic-operator e2e tests on a Konflux HyperShift ephemeral OpenShift cluster.
    Provisions the cluster, deploys the operator from the SNAPSHOT image with a fixed mock agent,
    runs make test-e2e, then deprovisions
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: 'agentic-e2e-tests'
      type: string
    - name: namespace
      description: 'Namespace to deploy the operator into'
      default: 'openshift-lightspeed'
      type: string
    - name: sandbox-mode
      description: 'Sandbox mode: bare-pod (default) or sandbox-claim'
      default: 'bare-pod'
      type: string
    - name: openshift-version-prefix
      description: 'OpenShift minor version to provision (for example, 4.22).'
      default: '4.22'
      type: string
  tasks:
    - name: provision-ephemeral-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: env
          value: '{"COMPUTE_NODE_TYPE": "m5.2xlarge", "HYPERSHIFT_NODE_COUNT": "3", "HOSTED_MANAGEMENT_CLUSTER": "hosted-mgmt2"}'
        - name: releases
          value: '{"latest":{"release":{"channel":"stable","version":"$(params.openshift-version-prefix)","architecture":"multi"}}}'
    - name: install-and-test
      description: Install operator from SNAPSHOT, run e2e tests.
      runAfter:
        - provision-ephemeral-cluster
      taskSpec:
        params:
          - name: SNAPSHOT
            type: string
          - name: clusterCredentialsSecretRef
            type: string
          - name: namespace
            type: string
          - name: sandbox-mode
            type: string
        results:
          - name: commit
            value: "$(steps.install-operator.results.commit)"
        volumes:
          - name: cluster-credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
          - name: ols-konflux-artifacts-bot-creds
            secret:
              secretName: ols-konflux-artifacts-bot
        steps:
          - name: install-operator
            results:
              - name: commit
                type: string
            volumeMounts:
              - name: cluster-credentials
                mountPath: /credentials
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: KONFLUX_COMPONENT_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['appstudio.openshift.io/component']
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: NAMESPACE
                value: "$(params.namespace)"
              - name: SANDBOX_IMAGE
                value: "quay.io/openshift-lightspeed/ols-qe:lightspeed-mock-agent1"
              - name: SANDBOX_MODE
                value: "$(params.sandbox-mode)"
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              set -euo pipefail
              dnf -y install jq git make golang
              OPERATOR_IMAGE="$(jq -r --arg component_name "${KONFLUX_COMPONENT_NAME}" '.components[] | select(.name == $component_name) | .containerImage' <<< "$SNAPSHOT")"
              if [ -z "$OPERATOR_IMAGE" ] || [ "$OPERATOR_IMAGE" = "null" ]; then
                echo "ERROR: could not extract operator image from SNAPSHOT"
                exit 1
              fi

              COMMIT="$(jq -r --arg component_name "${KONFLUX_COMPONENT_NAME}" '.components[] | select(.name == $component_name) | .source.git.revision' <<< "$SNAPSHOT")"
              if [ -z "$COMMIT" ] || [ "$COMMIT" = "null" ]; then
                echo "ERROR: could not extract git revision from SNAPSHOT"
                exit 1
              fi
              echo -n "${COMMIT}" > $(step.results.commit.path)

              git clone --depth=1 https://github.com/openshift/lightspeed-agentic-operator.git /workspace/repo
              cd /workspace/repo
              git fetch --depth=1 origin "${COMMIT}"
              git checkout "${COMMIT}"

              IMG="${OPERATOR_IMAGE}" \
              OPERATOR_NAMESPACE="${NAMESPACE}" \
              SANDBOX_IMAGE="${SANDBOX_IMAGE}" \
              SANDBOX_MODE="${SANDBOX_MODE}" \
              bash .tekton/integration-tests/scripts/install-operator.sh
          - name: run-e2e-tests
            resources:
              requests:
                memory: "8Gi"
              limits:
                memory: "8Gi"
            onError: continue
            volumeMounts:
              - name: cluster-credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: TEST_NAMESPACE
                value: "$(params.namespace)"
              - name: OPERATOR_NAMESPACE
                value: "$(params.namespace)"
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              set -euo pipefail
              dnf -y install git make golang
              cd /workspace/repo
              mkdir -p /workspace/konflux-artifacts
              make test-e2e 2>&1 | tee /workspace/konflux-artifacts/e2e-test-output.log
          - name: gather-cluster-resources
            onError: continue
            volumeMounts:
              - name: cluster-credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: ARTIFACT_DIR
                value: "/workspace/konflux-artifacts"
              - name: NAMESPACE
                value: "$(params.namespace)"
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            script: |
              #!/bin/bash
              set -x
              cd "${ARTIFACT_DIR}"
              oc get agenticruns -A -o yaml > agenticruns.yaml 2>/dev/null || true
              oc get agenticrunapprovals -A -o yaml > agenticrunapprovals.yaml 2>/dev/null || true
              oc get analysisresults -A -o yaml > analysisresults.yaml 2>/dev/null || true
              oc get executionresults -A -o yaml > executionresults.yaml 2>/dev/null || true
              oc get verificationresults -A -o yaml > verificationresults.yaml 2>/dev/null || true
              oc get pods -n "${NAMESPACE}" -o yaml > pods.yaml 2>/dev/null || true
              oc logs -n "${NAMESPACE}" deployment/controller-manager --tail=500 > operator-logs.txt 2>/dev/null || true
              echo "Artifacts gathered:"
              ls -la "${ARTIFACT_DIR}"
          - name: list-artifacts
            onError: continue
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            workingDir: /workspace/konflux-artifacts
            script: |
              #!/bin/bash
              echo "=== Artifacts to push ==="
              ls -la /workspace/konflux-artifacts
          - name: push-artifacts
            onError: continue
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
            params:
              - name: workdir-path
                value: /workspace/konflux-artifacts
              - name: oci-ref
                value: "quay.io/openshift-lightspeed/ols-operator-artifacts:agentic-$(steps.install-operator.results.commit)"
              - name: credentials-volume-name
                value: ols-konflux-artifacts-bot-creds
          - name: fail-if-any-step-failed
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: namespace
          value: "$(params.namespace)"
        - name: sandbox-mode
          value: "$(params.sandbox-mode)"
  finally:
    - name: deprovision-ephemeral-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/deprovision-ephemeral-cluster/0.1/deprovision-ephemeral-cluster.yaml
      params:
        - name: testPlatformClusterClaimName
          value: $(tasks.provision-ephemeral-cluster.results.testPlatformClusterClaimName)
        - name: testPlatformClusterClaimNamespace
          value: $(tasks.provision-ephemeral-cluster.results.testPlatformClusterClaimNamespace)
    - name: export-logs-for-retention
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/export-logs/0.1/export-logs-to-quay.yaml
      params:
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)
        - name: namespace
          value: $(context.pipelineRun.namespace)
        - name: quay-repo
          value: "quay.io/openshift-lightspeed/ols-operator-artifacts"
        - name: artifact-credentials-secret
          value: ols-konflux-artifacts-bot
